spring.application.name=musical-instruments

spring.datasource.url=jdbc:postgresql://postgres:5432/instruments_db
spring.datasource.username=instruments_user
spring.datasource.password=instruments_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

server.port=8080

jwt.secret=your-secret-key-change-this-in-production-use-long-random-string
jwt.expiration=86400000
