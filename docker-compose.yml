services:
  postgres:
    image: postgres:15-alpine
    container_name: instruments_postgres
    environment:
      POSTGRES_DB: instruments_db
      POSTGRES_USER: instruments_user
      POSTGRES_PASSWORD: instruments_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instruments_user -d instruments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instruments_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/instruments_db
      SPRING_DATASOURCE_USERNAME: instruments_user
      SPRING_DATASOURCE_PASSWORD: instruments_pass
    restart: unless-stopped

